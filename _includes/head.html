<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- comment -%}
  Política de privacidad aplicada por el navegador: solo recursos propios.
  La única excepción es el iframe de YouTube (sin cookies), que se carga
  únicamente cuando el visitante pulsa reproducir.
{%- endcomment %}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
{% seo %}
{% feed_meta %}
