<!DOCTYPE html>
<!-- Banner de YouTube: 2560 × 1440. Todo el texto vive dentro del área segura
     de 1546 × 423 centrada, que es lo único visible en todos los dispositivos. -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body { width: 2560px; height: 1440px; position: relative;
  background:
    radial-gradient(ellipse 1400px 700px at 50% 42%, #24221B 0%, transparent 70%),
    var(--bg); }
/* Rejilla tenue: guiño a la terminal del sitio, solo fuera del área segura */
body::before { content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 80px 80px; opacity: 0.35;
  mask-image: radial-gradient(ellipse 1300px 520px at 50% 50%, transparent 55%, #000 100%); }
.safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px;
  display: flex; align-items: center; gap: 64px; padding: 0 40px; }
.monogram { width: 220px; height: 220px; border-width: 4px; font-size: 86px; flex-shrink: 0; }
.name { font-family: var(--serif); font-weight: 600; font-size: 84px; white-space: nowrap; line-height: 1.05; letter-spacing: -0.01em; }
.name span { color: var(--text-muted); font-weight: 500; }
.tag { margin-top: 28px; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); }
.url { margin-top: 18px; font-size: 26px; letter-spacing: 0.06em; color: var(--text-muted); }
.url b { color: var(--accent); font-weight: 500; }
body.guides .safe { outline: 3px dashed #ff4d4d; }
</style></head><body><div class="safe">
  <div class="monogram">FC</div>
  <div>
    <div class="name">Fernando <span>Cortés Calderón</span></div>
    <div class="tag">ciberseguridad · soporte · proyectos</div>
    <div class="url"><b>cortescalderon.com</b>/blog</div>
  </div>
</div>
<script>if (location.search.includes('guides')) document.body.classList.add('guides');</script>
</body></html>
